[[plugins]]
  package = "netlify-plugin-11ty"
  [plugins.inputs]
    cache_img = 'assets/images'

[[headers]]
  for = "/*"
  [headers.values]
  "Content-Security-Policy" = "script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com https://platform.twitter.com https://plausible.io https://app.netlify.com https://cdnjs.cloudflare.com https://widget.clutch.co https://www.googletagmanager.com https://www.googleadservices.com https://t.contentsquare.net https://static.cloudflareinsights.com; worker-src 'self' blob:; frame-src https://challenges.cloudflare.com https://app.netlify.com  https://www.youtube-nocookie.com https://widget.clutch.co https://platform.twitter.com; object-src 'none';"

[build]
  environment = { NODE_VERSION = "22.13.0" }
  command = "echo '//registry.npmjs.org/:_authToken=${NPM_TOKEN}' >> .npmrc && pnpm install && pnpm build"

# serve 404 simplabs' sitemap
  [[redirects]]
    from = "https://simplabs.com/sitemap.xml"
    to = "/404.html"
    status = 404

